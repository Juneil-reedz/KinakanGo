<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kinakan Go - Food Delivery</title>
    <script>
      // Apply the saved theme before first paint so light mode doesn't flash dark
      try { if (localStorage.getItem('kkg_theme') === 'light') document.documentElement.classList.add('light'); } catch (e) {}
    </script>
    <script>
      // Restore path after SPA redirect from 404.html
      (function () {
        var redirect = sessionStorage.getItem('spa_redirect');
        if (redirect) {
          sessionStorage.removeItem('spa_redirect');
          window.history.replaceState(null, '', redirect || '/');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
